<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>시민안전보험 담보별 구비서류</title>

<style>
body{
  font-family:"맑은 고딕";
  background:#f5f7fb;
  padding:30px;
}

h2{
  color:#163b7a;
  margin-bottom:20px;
}

.file{
  display:block;
  margin-bottom:10px;
  padding:12px 14px;
  border-radius:12px;
  background:#fff;
  border:1px solid #d9e3f0;
  text-decoration:none;
  color:#163b7a;
  font-weight:700;
}

.file:hover{
  background:#edf4ff;
}
</style>
</head>

<body>

<h2>시민안전보험 담보별 구비서류</h2>

<div id="fileList"></div>

<script>
const files = [
  "사망.pdf",
  "상해의료비.pdf",
  "상해의료비(실손가입자제외).pdf",
  "상해진단금.pdf",
  "스쿨존·실버존·어린이보행중·대중교통부상치료비.pdf",
  "자연재해상해진단위로금.pdf",
  "후유장해.pdf",
  "강도상해후유장해.pdf",
  "개물림사고(응급·비응급)치료비.pdf",
  "성폭력범죄발생보상금.pdf",
  "화상수술비(롯데_2025.7.7이후).pdf",
  "화상수술비(DB외).pdf",
  "화상수술비+화상수술치료비.pdf",
  "화상수술치료비.pdf",
  "강력범죄피해보상금(DB).pdf",
  "강력범죄피해보상금(농협).pdf",
  "개물림부딪힘진단비.pdf",
  "개물림사고진단금(연간1회).pdf",
  "개물림응급비응급치료비.pdf",
  "개물림응급실내원.pdf",
  "독액성동물응급실내원진료비.pdf",
  "사망장례비용.pdf",
  "상해의료비(실손가입자제외)+상해진단금.pdf",
  "성폭력범죄상해.pdf",
  "어린이학교폭력피해보장금.pdf",
  "온열한랭질환진단비.pdf",
  "재난지원비용.pdf",
  "전동보조기기사고부상치료비.pdf"
];

const box = document.getElementById("fileList");

files.forEach(file => {

  const a = document.createElement("a");

  a.href = encodeURI(file);

  a.target = "_blank";

  a.className = "file";

  a.textContent = file.replace(".pdf","");

  box.appendChild(a);

});
</script>

</body>
</html>
