<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>시민안전보험 담보별 구비서류</title>

<style>
body{
  font-family:"맑은 고딕";
  background:#f5f7fb;
  padding:30px;
}

h2{
  color:#163b7a;
  margin-bottom:20px;
}

.file{
  display:block;
  margin-bottom:10px;
  padding:12px 14px;
  border-radius:12px;
  background:#fff;
  border:1px solid #d9e3f0;
  text-decoration:none;
  color:#163b7a;
  font-weight:700;
}

.file:hover{
  background:#edf4ff;
}
</style>
</head>

<body>

<h2>시민안전보험 담보별 구비서류</h2>

<div id="fileList"></div>

<script>
const files = [

"★구비서류안내(사망).pdf",
"★구비서류안내(상해의료비)-실손가입자 제외.pdf",
"★구비서류안내(상해의료비).pdf",
"★구비서류안내(상해진단금).pdf",
"★구비서류안내(스쿨존 실버존 어린이보행중 대중교통부상치료비).pdf",
"★구비서류안내(자연재해_상해진단위로금).pdf",
"★구비서류안내(후유장해).pdf",
"★시민안전보험 보험금 청구서류_강도상해_ 후유장해.pdf",
"★시민안전보험 보험금 청구서류_개물림 사고(응급&비응급) 치료비.pdf",
"★시민안전보험 보험금 청구서류_성폭력범죄발생보상금.pdf",
"★화상수술비(25.7.7~)_롯데.pdf",
"★화상수술비(DB 외).pdf",
"★화상수술비+화상수술치료비.pdf",
"★화상수술치료비.pdf",
"강력범죄피해 보상금(DB).pdf",
"강력범죄피해보상금(농협).pdf",
"개물림 부딪힘 진단비.pdf",
"개물림 사고 진단금-연간1회.pdf",
"구비서류 안내(개물림응급비응급치료비).pdf",
"구비서류안내(개물림응급실내원).pdf",
"구비서류안내(독액성동물 응급실내원진료비).pdf",
"구비서류안내(사망_장례비용).pdf",
"구비서류안내(상해의료비-실손가입자 제외)+(상해진단금).pdf",
"구비서류안내(성폭력범죄상해).pdf",
"구비서류안내(어린이학교폭력피해보장금).pdf",
"구비서류안내(온열한랭 질환 진단비).pdf",
"구비서류안내(재난지원비용).pdf",
"구비서류안내(전동보조기기(전동휠체어,의료용스쿠터)사고 부상치료비.pdf"

];

const box = document.getElementById("fileList");

files.forEach(file => {

  const a = document.createElement("a");

  a.href = encodeURI(file);

  a.target = "_blank";

  a.className = "file";

  a.textContent = file.replace(".pdf","");

  box.appendChild(a);

});
</script>

</body>
</html>
