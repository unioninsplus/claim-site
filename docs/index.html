<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>시민안전보험 담보별 구비서류</title>

<style>
body{
  font-family:"맑은 고딕";
  background:#f5f7fb;
  padding:30px;
}

h2{
  color:#163b7a;
  margin-bottom:20px;
}

.file{
  display:block;
  margin-bottom:10px;
  padding:12px 14px;
  border-radius:12px;
  background:#fff;
  border:1px solid #d9e3f0;
  text-decoration:none;
  color:#163b7a;
  font-weight:700;
}

.file:hover{
  background:#edf4ff;
}
</style>
</head>

<body>

<h2>시민안전보험 담보별 구비서류</h2>

<div id="fileList"></div>

<script>
const files = [
  "사망.pdf",
  "위임장.pdf",
  "강력범죄피해보상금.pdf",
  "개물림 부딪힘 진단비.pdf",
  "개물림 사고(응급&비응급) 치료비.pdf",
  "개물림응급실내원진료비.pdf",
  "군복무 상해보험 상해흉터성형수술비.pdf",
  "군복무상해보험 골절진단금.pdf",
  "군복무상해보험 깁스치료비.pdf",
  "군복무상해보험 상해입원일당.pdf",
  "급성감염병사망.pdf",
  "독액성동물 응급실내원진료비.pdf",
  "사망-장례비용.pdf",
  "상해사고진단금 (12세이하, 60세이상만 적용).pdf",
  "상해사고진단금 (12세이하, 61세이상만 적용).pdf",
  "상해사고진단금 (12세이하, 65세이상만 적용).pdf",
  "상해사고진단금(12세 이상 적용).pdf",
  "상해사고진단금(12세이하만 적용).pdf",
  "상해사고진단금(15세미만, 65세이상적용).pdf",
  "상해사고진단금(15세이하, 60세 이상만 적용).pdf",
  "상해사고진단금(65세 이상 적용).pdf",
  "상해사고진단금.pdf",
  "상해의료비(실손가입자제외).pdf",
  "상해의료비+상해진단위로금.pdf",
  "상해의료비.pdf",
  "성폭력범죄발생보상금.pdf",
  "성폭력범죄상해.pdf",
  "스쿨존 실버존 어린이보행중 대중교통)부상치료비.pdf",
  "어린이(상해수술비)12세이하.pdf",
  "어린이학교폭력피해보장금.pdf",
  "연재해상해진단위로금.pdf",
  "온열+한랭질환 진단비.pdf",
  "온열질환 진단비.pdf",
  "의료사고법률비용.pdf",
  "의사자 보상금.pdf",
  "의상자 보상금.pdf",
  "자연재해 상해진단금+입원일당.pdf",
  "자연재해 정신치료비.pdf",
  "자연재해 후유장해.pdf",
  "자전거상해 진단위로금.pdf",
  "재난비용지원.pdf",
  "전동보조기기(전동휠체어,의료용스쿠터사고) 부상치료비.pdf",
  "화상수술비+화상수술치료비.pdf",
  "화상수술비.pdf",
  "후유장해.pdf"
];

const box = document.getElementById("fileList");

files.forEach(file => {

  const a = document.createElement("a");

  a.href = encodeURI(file);

  a.target = "_blank";

  a.className = "file";

  a.textContent = file.replace(".pdf","");

  box.appendChild(a);

});
</script>

</body>
</html>
